<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Admission Form - GCET Jammu
  </title>
  <link href="style.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div class="navbar">
    <div class="logo">
     <div class="logo-circle">
      GCET
     </div>
     <h2>
      GCET Jammu
     </h2>
    </div>
    <ul class="nav-links">
     <li>
      <a href="index.html">
       Home
      </a>
     </li>
     <li>
      <a href="about.html">
       About
      </a>
     </li>
     <li>
      <a href="faculty.html">
       Faculty
      </a>
     </li>
     <li>
      <a href="students.html">
       Students
      </a>
     </li>
     <li>
      <a href="gallery.html">
       Photo Gallery
      </a>
     </li>
     <li>
      <a href="admission.html">
       Admission Form
      </a>
     </li>
    </ul>
   </div>
  </header>
  <main class="container">
   <section class="section">
    <h2>
     Student Admission Form
    </h2>
    <div class="form-box">
     <form>
      <div class="form-group">
       <label>
        Name
       </label>
       <input placeholder="Enter your name" required="" type="text"/>
      </div>
      <div class="form-group">
       <label>
        Email
       </label>
       <input placeholder="Enter your email" required="" type="email"/>
      </div>
      <div class="form-group">
       <label>
        Date of Birth
       </label>
       <input required="" type="date"/>
      </div>
      <div class="form-group">
       <label>
        Mobile Number
       </label>
       <input placeholder="Enter mobile number" required="" type="tel"/>
      </div>
      <div class="form-group">
       <label>
        Gender
       </label>
       <div class="radio-group">
        <label>
         <input name="gender" type="radio"/>
         Male
        </label>
        <label>
         <input name="gender" type="radio"/>
         Female
        </label>
        <label>
         <input name="gender" type="radio"/>
         Other
        </label>
       </div>
      </div>
      <div class="form-group">
       <label>
        Course
       </label>
       <select>
        <option>
         Select Course
        </option>
        <option>
         B.Tech Computer Engineering
        </option>
        <option>
         B.Tech Civil Engineering
        </option>
        <option>
         B.Tech Electrical Engineering
        </option>
        <option>
         B.Tech Mechanical Engineering
        </option>
        <option>
         B.Tech E&amp;C Engineering
        </option>
       </select>
      </div>
      <div class="form-group">
       <label>
        Hobbies
       </label>
       <div class="radio-group">
        <label>
         <input type="checkbox"/>
         Sports
        </label>
        <label>
         <input type="checkbox"/>
         Gaming
        </label>
        <label>
         <input type="checkbox"/>
         Reading
        </label>
        <label>
         <input type="checkbox"/>
         Music
        </label>
       </div>
      </div>
      <div class="form-group">
       <label>
        Address
       </label>
       <textarea placeholder="Enter your address"></textarea>
      </div>
      <button class="btn" type="submit">
       Submit
      </button>
      <button class="btn" type="reset">
       Reset
      </button>
     </form>
    </div>
   </section>
  </main>
  <footer>
   <p>
    Government College of Engineering &amp; Technology, Jammu
   </p>
   <p>
    Chak Bhalwal, Jammu - 181122
   </p>
  </footer>
 </body>
</html>
